
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DL RETRO GAMES PS3</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #050b18;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #0064ff;
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

#status {
    margin: 12px;
    padding: 12px;
    background: #101d35;
    border: 1px solid #2675ff;
    font-size: 14px;
    overflow-wrap: anywhere;
}

button {
    display: block;
    width: 90%;
    margin: 15px auto;
    padding: 15px;
    background: #0064ff;
    color: white;
    border: 0;
    font-size: 18px;
    font-weight: bold;
}

#game {
    width: 100%;
    height: 75vh;
    min-height: 350px;
    background: black;
}
</style>
</head>

<body>

<header>DL RETRO GAMES PS3</header>

<div id="status">AGUARDANDO INÍCIO...</div>

<button onclick="iniciar()">INICIAR EMULADOR</button>

<div id="game"></div>

<script>
function mensagem(texto) {
    document.getElementById("status").innerHTML = texto;
}

window.onerror = function(msg, url, linha, coluna, erro) {
    mensagem(
        "ERRO JAVASCRIPT: " + String(msg) +
        "<br>Arquivo: " + (url || "Desconhecido") +
        "<br>Linha: " + (linha || "?") +
        "<br>Coluna: " + (coluna || "?")
    );
    return true;
};

function iniciar() {
    mensagem("ETAPA 1: CONFIGURANDO EMULADOR...");

    window.EJS_player = "#game";
    window.EJS_core = "snes";
    window.EJS_gameName = "Super Mario World";
    window.EJS_color = "#0064ff";
    window.EJS_startOnLoaded = true;
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_gameUrl = "./Super Mario World (Europe).sfc";

    mensagem("ETAPA 2: CARREGANDO LOADER...");

    var script = document.createElement("script");

    script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";

    script.onload = function() {
        mensagem("LOADER CARREGADO! AGUARDANDO EMULADOR...");
    };

    script.onerror = function(event) {
        mensagem(
            "FALHA AO CARREGAR LOADER!<br>" +
            "O PS3 não conseguiu baixar o EmulatorJS.<br>" +
            "Verifique a conexão e a compatibilidade do navegador."
        );
    };

    document.body.appendChild(script);
}
</script>

</body>
</html>

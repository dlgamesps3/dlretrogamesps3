
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>DL RETRO PS3 - Diagnóstico</title>
<style>
body {
    margin: 0;
    background: #080d19;
    color: white;
    font-family: Arial;
}
header {
    background: #101c35;
    padding: 15px;
    text-align: center;
}
h1 { color: #38a1ff; }
#status {
    padding: 15px;
    color: #ffdb70;
}
#game {
    width: 100%;
    height: 420px;
    background: black;
}
button {
    padding: 15px;
    background: #087cff;
    color: white;
    border: 0;
}
</style>
</head>
<body>

<header>
<h1>DL RETRO GAMES</h1>
<p>TESTE EMULADOR SNES</p>
</header>

<div id="status">Aguardando início...</div>

<button onclick="iniciar()">INICIAR EMULADOR</button>

<div id="game"></div>

<script>
function mensagem(texto) {
    document.getElementById("status").innerHTML = texto;
}

function iniciar() {
    mensagem("ETAPA 1: Preparando emulador...");

    window.onerror = function(msg) {
        mensagem("ERRO JAVASCRIPT: " + msg);
    };

    EJS_player = "#game";
    EJS_core = "snes";
    EJS_gameName = "Super Mario World";
    EJS_color = "#0064ff";
    EJS_startOnLoaded = true;
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    EJS_gameUrl = "./Super Mario World (Europe).sfc";

    mensagem("ETAPA 2: Carregando EmulatorJS...");

    var script = document.createElement("script");

    script.onload = function() {
        mensagem("ETAPA 3: Loader carregado. Verificando inicialização...");
    };

    script.onerror = function() {
        mensagem("ERRO: PS3 não conseguiu carregar o loader.js");
    };

    script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";

    document.body.appendChild(script);
}
</script>

</body>
</html>

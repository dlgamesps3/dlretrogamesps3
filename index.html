
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DL RETRO GAMES PS3</title>

<style>
body {
    margin: 0;
    background: #080d19;
    color: white;
    font-family: Arial, sans-serif;
}
header {
    background: #101c35;
    padding: 15px;
    text-align: center;
    border-bottom: 3px solid #087cff;
}
h1 { color: #38a1ff; }
#status {
    background: #14233b;
    color: #ffdb70;
    padding: 12px;
    margin: 10px;
    overflow-wrap: break-word;
}
#game {
    width: 100%;
    height: 420px;
    background: black;
}
button {
    padding: 15px 20px;
    background: #087cff;
    color: white;
    border: 0;
    margin: 10px;
    font-size: 16px;
}
</style>
</head>

<body>

<header>
<h1>DL RETRO GAMES</h1>
<p>TESTE EMULADOR SUPER NINTENDO</p>
</header>

<div id="status">Aguardando início...</div>

<button onclick="iniciar()">INICIAR EMULADOR</button>

<div id="game"></div>

<script>
function mensagem(texto) {
    document.getElementById("status").innerHTML = texto;
}

window.onerror = function(msg, url, linha, coluna, erro) {
    var detalhes = "ERRO JAVASCRIPT: " + msg;
    detalhes += "<br>Arquivo: " + (url || "desconhecido");
    detalhes += "<br>Linha: " + (linha || "?");
    detalhes += "<br>Coluna: " + (coluna || "?");

    mensagem(detalhes);
    return true;
};

function iniciar() {

    mensagem("ETAPA 1: Preparando emulador...");

    window.EJS_player = "#game";
    window.EJS_core = "snes";
    window.EJS_gameName = "Super Mario World";
    window.EJS_color = "#0064ff";
    window.EJS_startOnLoaded = true;
    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_gameUrl =
        "./Super Mario World (Europe).sfc";

    mensagem("ETAPA 2: Carregando EmulatorJS...");

    var script = document.createElement("script");

    script.onload = function() {
        mensagem(
            "ETAPA 3: Loader carregado!<br>" +
            "Aguardando inicialização do emulador..."
        );
    };

    script.onerror = function(evento) {
        mensagem(
            "ERRO AO CARREGAR LOADER.JS<br>" +
            "O navegador não conseguiu carregar o EmulatorJS."
        );
    };

    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";

    document.body.appendChild(script);
}
</script>

</body>
</html>
